name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  WHISPER_DONT_GENERATE_BINDINGS: "1"

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      # The vendored p25-protocol, imbe-vocoder and p25-filters crates opt out
      # of clippy at their crate roots; everything else is held to -D warnings.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: radio-core builds without RTL-SDR support
        run: cargo check -p radio-core --no-default-features --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: trunkline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

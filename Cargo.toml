[workspace]
members = [
    "crates/imbe-vocoder",
    "crates/p25-filters",
    "crates/p25-protocol",
    "crates/radio-core",
    "crates/trunkline-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dawilco/trunkline"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
num-complex = "0.4"
rs-rtl = "0.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.16.0", features = ["openmp", "tracing_backend"] }

[patch.crates-io]
static_fir = { path = "third-party/static-fir" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
